<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="application-name" content="Bring Gift Card" />
    <meta name="theme-color" content="#F3F8FF" />
    <title>Bring Gift Card</title>
    <link rel="manifest" href="/manifest.json" />
    <style id="expo-reset">
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background: #F3F8FF;
        overscroll-behavior: none;
      }
      body { overflow: hidden; }
      #root {
        position: fixed;
        inset: 0;
        display: flex;
        flex: 1;
        background: #F3F8FF;
      }
      /* Preserve the approved clean field focus appearance in single-page web builds. */
      input:focus,
      textarea:focus,
      [contenteditable="true"]:focus {
        outline: none !important;
        outline-width: 0 !important;
        box-shadow: none !important;
      }
      input, textarea { -webkit-tap-highlight-color: transparent; }
      /* Text fields use the app's own field styling. Do not draw an extra
         browser focus rectangle around the input or its parent container. */
      #root :is(button, a, [role="button"], [role="tab"]):focus-visible {
        outline: 2px solid #1F5AF6;
        outline-offset: 2px;
      }
      [role="tablist"] [role="tab"] *,
      [role="heading"], [role="heading"] * { overflow: visible !important; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
